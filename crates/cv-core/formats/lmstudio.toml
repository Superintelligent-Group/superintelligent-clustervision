# formats/lmstudio.toml — the vocabulary cv's `lmstudio` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "lmstudio"
source_files = ["harness/lmstudio.rs"]
store = [
  "~/.lmstudio/conversations/<ms-epoch>.conversation.json",
]

[upstream]
repo = "closed source"
commit = "unknown"
date = "2026-05-29"

[types]
"role.assistant" = { status = "generic", note = "multiStep" }
"message.singleStep" = { status = "generic", note = "" }
"message.multiStep" = { status = "generic", note = "" }
"block.contentBlock" = { status = "generic", note = "style.type thinking → reasoning" }
"part.text" = { status = "generic", note = "" }
"part.file" = { status = "generic", note = "" }
