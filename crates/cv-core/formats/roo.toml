# formats/roo.toml — the vocabulary cv's `roo` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "roo"
# Roo has no parser or writer of its own: `harness/roo.rs` points the Cline code at Roo's roots, so
# the vocabulary is checked against the file that actually interprets it.
source_files = ["harness/cline.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
ignore_literals = []
store = [
  "<globalStorage>/rooveterinaryinc.roo-cline|roo-code/tasks/<taskId>/",
  "~/.roo/tasks/",
  "~/.vscode-mock/global-storage/tasks/<taskId>/ (the Roo CLI's mock VS Code host)",
]

[upstream]
repo = "https://github.com/RooCodeInc/Roo-Code (not checked out)"
commit = "cli-v0.1.17 (Roo Code CLI release, bundled extension; tests/corpus/roo/0.1.17)"
date = "2026-10-11"

[types]
"block.thinking" = { status = "handled", note = "" }
"block.redacted_thinking" = { status = "handled", note = "" }
"block.tool_use" = { status = "handled", note = "" }
"block.tool_result" = { status = "handled", note = "" }
"block.image" = { status = "handled", note = "" }
"ui.ask" = { status = "generic", note = "" }
"ui.completion_result" = { status = "generic", note = "" }
"msg.isSummary" = { status = "handled", note = "condense summary -> CompactionSummary, preceded by a synthetic CompactionBoundary" }
"msg.condenseParent" = { status = "handled", note = "a turn a condense replaced; kept, flagged condensed_into" }
"history_item.json" = { status = "handled", note = "parentTaskId -> Lineage.parent; mode, rootTaskId, totals -> extra" }
"tasks/_index.json" = { status = "ignored", note = "the task-history index; history_item.json carries the same row" }
"checkpoints" = { status = "ignored", note = "per-task shadow git repo; ui checkpoint_saved records point into it" }
