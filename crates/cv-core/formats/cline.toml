# formats/cline.toml — the vocabulary cv's `cline` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "cline"
source_files = ["harness/cline.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
ignore_literals = []
store = [
  "<globalStorage>/saoudrizwan.claude-dev/tasks/<taskId>/{api_conversation_history.json,ui_messages.json,task_metadata.json}",
  "~/.cline/tasks/",
]

[upstream]
repo = "https://github.com/cline/cline (not checked out)"
commit = "unknown"
date = "2026-05-29"

[types]
"block.text" = { status = "handled", note = "" }
"block.thinking" = { status = "handled", note = "" }
"block.redacted_thinking" = { status = "handled", note = "" }
"block.tool_use" = { status = "handled", note = "" }
"block.tool_result" = { status = "handled", note = "" }
"block.image" = { status = "handled", note = "" }
"ui.ask" = { status = "generic", note = "" }
"ui.completion_result" = { status = "generic", note = "" }
