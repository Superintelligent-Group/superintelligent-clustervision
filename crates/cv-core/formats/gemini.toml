# formats/gemini.toml — the vocabulary cv's `gemini` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "gemini"
source_files = ["harness/gemini.rs"]
ignore_literals = ["json", "jsonl"]
store = [
  "~/.gemini/tmp/<project>/chats/session-*.json|.jsonl",
  "~/.cache/.gemini/tmp/<project>/chats/ (sandbox root)",
  "~/.gemini/tmp/<project>/checkpoint-*.json",
  "~/.gemini/tmp/<project>/logs.json",
  "~/.gemini/projects.json",
  "~/.gemini/history/<id>/.project_root",
]

[upstream]
repo = "https://github.com/google-gemini/gemini-cli (~/pug/gemini-cli)"
commit = "cfbcaa8"
date = "2026-09-19"

[types]
"control.$set" = { status = "generic", note = "metadata update" }
"control.$rewindTo" = { status = "generic", note = "rewind" }
"part.text" = { status = "generic", note = "" }
"part.thought" = { status = "generic", note = "thoughts[]" }
"part.functionCall" = { status = "generic", note = "toolCalls[]" }
"part.functionResponse" = { status = "generic", note = "" }
"part.inlineData" = { status = "generic", note = "image" }
"part.fileData" = { status = "generic", note = "file" }
