[package]
name = "clustervision"
description = "clustervision CLI — search, read, and port AI coding-agent sessions across harnesses."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
# SIGPIPE reset: a Rust binary piped into `head`/`grep -q` panics on broken pipe by
# default; a CLI whose output is made for pipes must die quietly like every other
# unix tool. Unix-only (no-op dep elsewhere).
libc = "0.2"
cv-core = { path = "../cv-core", version = "0.14", package = "clustervision-core" }
cv-search = { path = "../cv-search", version = "0.14" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
uuid.workspace = true
# `llm.rs`: two blocking POSTs (OpenRouter / Anthropic / a local OpenAI-compatible server). `ureq`
# is already in the tree through cv-search's embedding stack, so this adds no HTTP stack of its own.
ureq = { version = "2", features = ["json"] }
# `cv serve`: a tiny synchronous HTTP server (no async stack for pages a few pollers read), plus
# the query-string encoder its banner uses.
tiny_http = { version = "0.12", default-features = false }
urlencoding = "2"

[dev-dependencies]
cv-testkit = { path = "../cv-testkit" }
