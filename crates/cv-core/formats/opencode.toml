# formats/opencode.toml — the vocabulary cv's `opencode` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "opencode"
source_files = ["harness/opencode.rs"]
ignore_literals = ["db"]
store = [
  "${XDG_DATA_HOME:-~/.local/share}/opencode/opencode.db",
  "~/.local/share/opencode/storage/{session,message,part}/** (dead JSON tree, fallback)",
]

[upstream]
repo = "https://github.com/anomalyco/opencode (~/pug/opencode)"
commit = "fee476bb"
date = "2026-09-19"

[types]
"table.session" = { status = "handled", note = "sqlite" }
"table.message" = { status = "handled", note = "sqlite; data re-hydrated with id/sessionID/messageID" }
"table.part" = { status = "handled", note = "sqlite" }
"table.todo" = { status = "ignored", note = "not read" }
"table.session_share" = { status = "ignored", note = "not read" }
"session.metadata" = { status = "handled", note = "probed; absent on un-migrated dbs" }
"error.ContentFilterError" = { status = "generic", note = "lifted to extra error_name" }
"error.ProviderAuthError" = { status = "generic", note = "" }
"error.ContextOverflowError" = { status = "generic", note = "" }
"error.MessageAbortedError" = { status = "generic", note = "" }
