# formats/opensession.toml — the vocabulary cv's `opensession` adapter is checked against (docs/INTERFACE-V2.md §7).
# status: handled = per-item arm in the adapter; generic = interpreted by a blanket rule; carried = verbatim
# under ParseOptions::complete only; ignored = known and deliberately skipped.
#
# OpenSession is cv's OWN format, so "upstream" is docs/OPENSESSION.md and the vocabulary is the IR's:
# 0.3 is the IR key for key, and the reader is the IR's own `Deserialize` behind a version check. So
# everything is `generic` except the two role words discovery counts for `message_count`; a second
# hand-written copy of the vocabulary here is exactly the drift that made 0.3 necessary.

harness = "opensession"
source_files = ["harness/opensession.rs"]
ignore_literals = []
store = [
  "registered *.opensession.json documents (cv config --add-export)",
  "any registered *.json whose head carries an `open_session` key",
]

[upstream]
repo = "docs/OPENSESSION.md (this repo)"
commit = "0.3"
date = "2026-09-20"

[types]
# ── the document envelope ──
"field.open_session" = { status = "generic", note = "0.3 version key; written first by `cv export --format json`; checked and stripped on read" }
"field.openSession" = { status = "ignored", note = "0.2 marker: sniffed in discovery only so the document is refused with a pointer, never read" }

# ── roles (discovery counts user + assistant turns straight off the raw records) ──
"role.user" = { status = "handled", note = "message_count" }
"role.assistant" = { status = "handled", note = "message_count" }
"role.tool" = { status = "generic", note = "ir::Role's Deserialize" }
"role.system" = { status = "generic", note = "ir::Role's Deserialize" }

# ── everything else is the IR ──
"block.*" = { status = "generic", note = "ir::Block's Deserialize (`type`-tagged text/thinking/tool_use/tool_result/image/file)" }
"kind.*" = { status = "generic", note = "ir::MessageKind's Deserialize" }
"origin.*" = { status = "generic", note = "ir::Origin's Deserialize" }
"field.harness" = { status = "generic", note = "Harness::parse; absent or unknown ⇒ `opensession`" }
