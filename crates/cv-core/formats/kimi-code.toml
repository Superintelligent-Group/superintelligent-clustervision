# formats/kimi-code.toml — the vocabulary cv's `kimi-code` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "kimi-code"
source_files = ["harness/kimi_code.rs", "harness/wire/openai.rs", "harness/wire/mod.rs"]
ignore_literals = []
store = [
  "$KIMI_CODE_HOME or ~/.kimi-code/sessions/wd_<slug>_<sha256[:12]>/session_<uuid>/agents/<id>/wire.jsonl",
  "…/state.json",
  "~/.kimi-code/session_index.jsonl",
]

[upstream]
repo = "Kimi Code bundle (@moonshot-ai/kimi-code 0.39.1, dist/main.mjs)"
commit = "0.39.1"
date = "2026-09-19"

[types]
"record.turn.prompt" = { status = "ignored", note = "UI twin of append_message" }
"record.turn.steer" = { status = "ignored", note = "" }
"record.turn.ended" = { status = "carried", note = "" }
"record.usage.record" = { status = "carried", note = "per-turn totals" }
"record.llm.request" = { status = "carried", note = "" }
"record.llm.tools_snapshot" = { status = "carried", note = "" }
"record.permission.*" = { status = "carried", note = "" }
"record.tools.*" = { status = "carried", note = "" }
"record.token_counting.*" = { status = "carried", note = "" }
"record.task.started" = { status = "carried", note = "" }
"record.plan_mode.*" = { status = "carried", note = "" }
"record.swarm_mode.*" = { status = "carried", note = "" }
"record.full_compaction.*" = { status = "carried", note = "" }
# Found by `cv formats census` on 2026-09-19 against 20 real ~/.kimi-code sessions — not in the
# 0.39.1 bundle read-through, so the census is how we learned about them.
"record.plugin.session_start" = { status = "carried", note = "plugin lifecycle" }
"record.prompt.accepted" = { status = "carried", note = "UI twin of turn.prompt" }
"record.runtime.set_binding" = { status = "carried", note = "" }
"record.staleGuard.recorded" = { status = "carried", note = "" }
"record.interruptionReminder.recorded" = { status = "carried", note = "" }
"part.text" = { status = "generic", note = "" }
"part.image_url" = { status = "generic", note = "" }
"agent.main" = { status = "generic", note = "the session" }
"agent.sub" = { status = "handled", note = "→ Session.extra agents" }
"role.user" = { status = "generic", note = "the `_` arm: user and anything unknown" }
# `message.origin.kind` — who put the text in the user slot.
"origin.injection" = { status = "generic", note = "injection/system_trigger/unknown -> InjectedContext/Harness" }
