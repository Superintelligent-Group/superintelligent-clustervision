# formats/openclaw.toml — the vocabulary cv's `openclaw` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "openclaw"
source_files = ["harness/openclaw.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
# Record FIELDS the parser names while copying the rest of an entry into extra[openclaw] —
# first-class in the IR, so they are not vocabulary.
ignore_literals = ["sqlite", "type", "id", "parentId", "timestamp", "summary", "content"]
store = [
  "$OPENCLAW_STATE_DIR/agents/<id>/agent/openclaw-agent*.sqlite",
  "$OPENCLAW_STATE_DIR/agents/<id>/sessions/*.jsonl (legacy)",
]

[upstream]
repo = "https://github.com/openclaw/openclaw (~/pug/openclaw)"
commit = "0e9181234a"
date = "2026-09-19"

[types]
"entry.leaf" = { status = "handled", note = "branch control; visible path selected" }
"entry.thinking_level_change" = { status = "carried", note = "" }
"entry.custom" = { status = "carried", note = "" }
"role.user" = { status = "generic", note = "" }
"role.assistant" = { status = "generic", note = "" }
"role.toolResult" = { status = "generic", note = "" }
"role.bashExecution" = { status = "generic", note = "" }
"role.branchSummary" = { status = "generic", note = "" }
"role.compactionSummary" = { status = "generic", note = "" }
"block.text" = { status = "generic", note = "" }
"block.thinking" = { status = "generic", note = "" }
"block.toolCall" = { status = "generic", note = "" }
"block.image" = { status = "generic", note = "" }
"thinking.redacted" = { status = "handled", note = "redacted thinking item -> Block::Thinking{redacted}" }
# Synthetic `model` values that mark a transcript-only echo rather than a real completion.
"table.transcript_events" = { status = "handled", note = "event_json = the JSONL line" }
"table.session_windows" = { status = "handled", note = "" }
"table.session_nodes" = { status = "handled", note = "entry_json = old sessions.json entry" }
"table.session_transcript_archives" = { status = "ignored", note = "zstd archives of reset/deleted history" }
"file.checkpoint" = { status = "ignored", note = "*.checkpoint.<uuid>.jsonl" }
"file.trajectory" = { status = "ignored", note = "*.trajectory.jsonl" }
"file.zst" = { status = "ignored", note = "cold-tier archive" }
"path.agents" = { status = "handled", note = "$OPENCLAW_STATE_DIR/agents/<id>/" }
